name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
      - name: Pytest
        env:
          ABSTRACTVOICE_RUN_AUDIODIT_TESTS: "0"
          ABSTRACTVOICE_RUN_OMNIVOICE_TESTS: "0"
        run: python -m pytest -q -m "not integration and not model_download"

  test-qwen3-tts:
    # The vendored Qwen3-TTS model tracks Transformers internals (masking_utils,
    # GenerationConfig fields). Run its tests against the declared floor and the
    # newest release the resolver picks, on CPU torch, so drift turns CI red.
    name: Qwen3-TTS (transformers ${{ matrix.transformers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["floor", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ "${{ matrix.transformers }}" = floor ]; then PIN="transformers==5.9.0"; else PIN=""; fi
          python -m pip install -e ".[test,qwen3-tts]" $PIN
          python -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)"
      - name: Pytest (Qwen3-TTS)
        run: python -m pytest -q -m "not integration and not model_download" tests/test_qwen3_tts_*.py

  test-qwen3-asr:
    # Same drift guard for the vendored Qwen3-ASR model (backlog 0946): the
    # stt-hf extra's transformers floor and the newest release, on CPU torch.
    name: Qwen3-ASR (transformers ${{ matrix.transformers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["floor", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ "${{ matrix.transformers }}" = floor ]; then PIN="transformers==5.4.0"; else PIN=""; fi
          python -m pip install -e ".[test,stt-hf]" $PIN
          python -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)"
      - name: Pytest (Qwen3-ASR)
        run: python -m pytest -q -m "not integration and not model_download" tests/test_qwen3_asr_*.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install "mkdocs>=1.6.0" "mkdocs-material>=9.0.0"
      - name: MkDocs build
        run: mkdocs build -q
